name: Nightly contract test

# Pulls 5 rows from the real data.gov.sg through the parser in Test, so a format
# change shows up before the 02:00 sync hits it. Doesn't block releases; opens or
# updates an issue when it fails.
on:
  schedule:
    - cron: "30 19 * * *"   # 03:30 SGT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Run contract suite
        id: run
        env:
          TESTS_BASE_URL: https://${{ vars.TEST_HOST }}/HDBResale_Tests
          TEST_API_TOKEN: ${{ secrets.TEST_API_TOKEN }}
        run: ./scripts/run-tests.sh contract junit-contract.xml | tee contract.log
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Contract test failing: data.gov.sg format or availability"
          body="$(printf 'Nightly contract test failed.\n\nRun: %s\n\n```\n%s\n```' "$RUN_URL" "$(tail -n 40 contract.log 2>/dev/null)")"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
